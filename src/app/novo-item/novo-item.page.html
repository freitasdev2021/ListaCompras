<app-interno titulo="Adicionar Item">
    <form>

        <ion-list>
            <ion-item id="open-modal-unidade" button="true">
                <!-- Exibe o nome do item selecionado ou um placeholder -->
                <ion-text>{{ itemSelecionado ? itemSelecionado.nome : 'Selecione uma unidade' }}</ion-text>
            </ion-item>

            <ion-item>
                <ion-select label="Unidade" label-placement="floating" value="media">
                <ion-select-option value="UN">UN</ion-select-option>
                <ion-select-option value="KG">KG</ion-select-option>
                <ion-select-option value="Grama">Grama</ion-select-option>
                </ion-select>
            </ion-item>

            <ion-item>
                <ion-input 
                label="Quantidade" 
                label-placement="floating" 
                placeholder="Digite o nome"
                name="taskTitle"
                required>
                </ion-input>
            </ion-item>

            <ion-button expand="block" type="submit" class="ion-margin">
                Adicionar
            </ion-button>
        </ion-list>

        <!-- O Modal de busca estilo "Datalist" -->
        <ion-modal trigger="open-modal-unidade" #modal>
            <ng-template>
                <ion-header>
                <ion-toolbar>
                    <ion-title>Selecionar Unidade</ion-title>
                    <ion-button slot="end">
                    <!-- Botão para fechar o modal sem selecionar -->
                    <ion-button (click)="modal.dismiss()">Fechar</ion-button>
                    </ion-button>
                </ion-toolbar>
                <ion-toolbar>
                    <!-- Barra de pesquisa que dispara a filtragem no .ts -->
                    <ion-searchbar 
                    placeholder="Pesquisar..." 
                    (ionInput)="filtrarItens($event)">
                    </ion-searchbar>
                </ion-toolbar>
                </ion-header>

                <ion-content class="ion-padding">
                <ion-list>
                    <!-- Loop renderiza apenas os itens filtrados pela busca -->
                    <ion-item 
                    button="true" 
                    *ngFor="let item of itensFiltrados" 
                    (click)="selecionarItem(item, modal)">
                    <ion-label>{{ item.nome }}</ion-label>
                    </ion-item>
                </ion-list>
                </ion-content>
            </ng-template>
        </ion-modal>
    </form>
</app-interno>
