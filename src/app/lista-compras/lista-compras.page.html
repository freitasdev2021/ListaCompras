<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="header-top">

            <div class="header-info">
                <h1>Listar Compras</h1>
            </div>

            <div class="header-icon">

        </div>

    </header>

          </div>

          <ion-button
              class="compra-item"
              fill="clear"
              routerLink="/compra/1">

              <div class="compra-conteudo">

                  <div class="compra-icone">
                      <ion-icon name="cart-outline"></ion-icon>
                  </div>

                  <div class="compra-info">
                      <strong>Materiais escolares</strong>
                      <small>25/09/2026</small>
                  </div>

              </div>

              <div class="compra-valor">
                  <strong>R$ 1.250,00</strong>

                  <ion-icon
                      name="chevron-forward-outline">
                  </ion-icon>
              </div>

          </ion-button>


          <!-- Compra -->
          <ion-button
              class="compra-item"
              fill="clear"
              routerLink="/compra/2">

                      <strong>Material de limpeza</strong>

              </div>

                      name="chevron-forward-outline">

          <!-- Compra -->

              class="compra-item"

              </div>

                  <strong>R$ 3.480,00</strong>

                  <ion-icon
                      name="chevron-forward-outline">

              </div>

          </ion-button>


          <!-- Compra -->
          <ion-button

                  <strong>R$ 620,00</strong>

                      name="chevron-forward-outline">
